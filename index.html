<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DKWin VIP PRO - AI EDITION</title>
    <style>
        :root {
            --neon-cyan: #00f2ff;
            --neon-pink: #ff00ea;
            --bg-dark: #02060c;
            --panel-bg: rgba(10, 15, 24, 0.95);
            --glass: rgba(255, 255, 255, 0.03);
            --red: #ff3366;
            --green: #00ff88;
            --gold: #ffcc00;
            --violet: #bf5af2;
        }

        /* গেম ক্লিয়ার ভিউ */
        body { margin: 0; background: #fff; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        iframe { width: 100vw; height: 100vh; border: none; filter: none !important; }

        /* ভাসমান ড্রাগেবল কন্টেইনার */
        #draggablePanel {
            width: 320px;
            position: fixed;
            z-index: 99999;
            cursor: move;
            touch-action: none;
        }

        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .glass-panel::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(transparent, var(--neon-cyan), transparent, var(--neon-pink), transparent);
            animation: rotate 6s linear infinite;
            z-index: -1;
            opacity: 0.2;
        }

        @keyframes rotate { 100% { transform: rotate(360deg); } }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .brand { display: flex; align-items: center; gap: 8px; font-weight: 900; font-size: 14px; color: var(--neon-cyan); }
        .status-indicator { background: rgba(0, 255, 136, 0.1); padding: 4px 10px; border-radius: 20px; font-size: 9px; color: var(--green); border: 1px solid var(--green); display: flex; align-items: center; gap: 5px; }
        .dot-pulse { width: 6px; height: 6px; background: var(--green); border-radius: 50%; animation: pulse 1.5s infinite; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .stat-card { background: var(--glass); padding: 10px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); text-align: center; }
        .stat-label { font-size: 9px; text-transform: uppercase; color: #888; margin-bottom: 3px; display: block; }
        .stat-value { font-size: 14px; font-weight: 800; color: var(--gold); }
        #time-left { font-size: 24px; color: #fff; }

        .prediction-box { 
            background: rgba(255,255,255,0.02); 
            border-radius: 20px; 
            padding: 25px 10px; 
            text-align: center; 
            border: 1px solid rgba(255,255,255,0.05); 
            margin-bottom: 15px; 
        }

        /* সিগন্যাল লেখাটি অনেক বড় এবং মোটা করা হয়েছে */
        #prediction-text { 
            font-size: 70px; 
            font-weight: 950; 
            margin: 5px 0; 
            text-shadow: 0 0 30px currentColor; 
            transition: 0.5s;
            letter-spacing: 2px;
        }
        
        .big-text { color: var(--green); }
        .small-text { color: var(--red); }

        .details-row { display: flex; justify-content: space-around; margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px; }
        
        /* নাম্বার সিগন্যাল বড় ও মোটা করা হয়েছে */
        .detail-item .val { 
            font-weight: 900; 
            font-size: 28px; 
            display: block; 
            color: var(--gold); 
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.4);
        }

        .meter-bg { height: 4px; background: #1a1f26; border-radius: 10px; margin-top: 5px; overflow: hidden; }
        .meter-fill { height: 100%; width: 98.4%; background: linear-gradient(90deg, var(--neon-cyan), var(--green)); }

        .history-list { display: flex; justify-content: center; gap: 5px; margin-top: 10px; }
        .h-dot { width: 25px; height: 25px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: #fff; }
        
        .bg-red { background: var(--red); }
        .bg-green { background: var(--green); }
        .bg-violet { background: linear-gradient(135deg, var(--red) 50%, var(--violet) 50%); }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        .urgent { color: var(--red) !important; animation: shake 0.2s infinite; }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(2px); } 50% { transform: translateX(-2px); } 100% { transform: translateX(0); } }
    </style>
</head>
<body>

<iframe src="https://dkwin9.com/#/register?invitationCode=75518598003"></iframe>

<div id="draggablePanel">
    <div class="glass-panel">
        <div class="header">
            <div class="brand">DKWin VIP PRO</div>
            <div class="status-indicator"><div class="dot-pulse"></div> ACTIVE</div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-label">Period</span>
                <span id="period-id" class="stat-value">--------</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Timer</span>
                <span id="time-left" class="stat-value">30</span>
            </div>
        </div>

        <div class="prediction-box">
            <span class="stat-label" style="font-weight: bold; color: var(--neon-cyan);">AI ANALYZED SIGNAL</span>
            <div id="prediction-text">WAIT</div>
            <div class="details-row">
                <div class="detail-item">
                    <span class="stat-label">Numbers</span>
                    <span id="num-val" class="val">--</span>
                </div>
                <div class="detail-item">
                    <span class="stat-label">Color</span>
                    <span id="color-val" class="val" style="font-size: 18px;">---</span>
                </div>
            </div>
        </div>

        <div class="meter-bg"><div class="meter-fill"></div></div>

        <div id="history-box" class="history-list"></div>
    </div>
</div>

<script>
let lastPeriod = "";
const panel = document.getElementById("draggablePanel");
const historyBox = document.getElementById("history-box");

function updateTick() {
    const now = new Date();
    const sec = now.getSeconds();
    const remain = 30 - (sec % 30);
    
    const totalSeconds = (now.getHours() * 3600) + (now.getMinutes() * 60) + sec;
    const periodIdx = Math.floor(totalSeconds / 30);
    const dateStr = now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0');
    const currentP = `${dateStr}1000${String(periodIdx).padStart(4,'0')}`;

    const timerEl = document.getElementById("time-left");
    timerEl.textContent = remain < 10 ? "0" + remain : remain;
    
    if(remain <= 5) timerEl.classList.add("urgent");
    else timerEl.classList.remove("urgent");

    if (currentP !== lastPeriod) {
        lastPeriod = currentP;
        document.getElementById("period-id").textContent = currentP;
        generateNewSignal();
    }
}

function generateNewSignal() {
    const isBig = Math.random() > 0.5;
    const predText = document.getElementById("prediction-text");
    const numVal = document.getElementById("num-val");
    const colorVal = document.getElementById("color-val");
    
    let numbers = isBig ? pickTwo([5, 6, 7, 8, 9]) : pickTwo([0, 1, 2, 3, 4]);
    
    predText.textContent = isBig ? "BIG" : "SMALL";
    predText.className = isBig ? "big-text" : "small-text";
    numVal.textContent = `${numbers[0]},${numbers[1]}`;

    const c1 = getColorData(numbers[0]);
    colorVal.textContent = c1.name;
    colorVal.style.color = c1.hex;

    addToHistory(numbers[0], c1.class);
}

function pickTwo(arr) { return arr.sort(() => 0.5 - Math.random()).slice(0, 2); }

function getColorData(n) {
    if (n === 0 || n === 5) return { name: "Violet", hex: "#bf5af2", class: "bg-violet" };
    if (n % 2 === 0) return { name: "Red", hex: "#ff3366", class: "bg-red" };
    return { name: "Green", hex: "#00ff88", class: "bg-green" };
}

function addToHistory(n, cls) {
    const item = document.createElement("div");
    item.className = `h-dot ${cls}`;
    item.textContent = n;
    historyBox.prepend(item);
    if(historyBox.children.length > 6) historyBox.removeChild(historyBox.lastChild);
}

// Drag Logic
let drag = false, startX, startY, x, y;
panel.onmousedown = panel.ontouchstart = (e) => {
    drag = true;
    const evt = e.touches ? e.touches[0] : e;
    const matrix = new WebKitCSSMatrix(window.getComputedStyle(panel).transform);
    x = matrix.m41; y = matrix.m42;
    startX = evt.clientX - x; startY = evt.clientY - y;
};
document.onmousemove = document.ontouchmove = (e) => {
    if (!drag) return;
    const evt = e.touches ? e.touches[0] : e;
    panel.style.transform = `translate(${evt.clientX - startX}px, ${evt.clientY - startY}px)`;
};
document.onmouseup = document.ontouchend = () => drag = false;

setInterval(updateTick, 1000);
updateTick();
window.onload = () => { panel.style.top = "10%"; panel.style.left = "10px"; };
</script>

</body>
</html>
